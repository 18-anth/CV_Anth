name: Enable GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-github-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable publication from gh-pages
        uses: actions/github-script@v7
        with:
          script: |
            const request = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              build_type: 'legacy',
              source: { branch: 'gh-pages', path: '/' },
            };
            try {
              await github.request('POST /repos/{owner}/{repo}/pages', request);
            } catch (error) {
              if (error.status !== 409) throw error;
              await github.request('PUT /repos/{owner}/{repo}/pages', request);
            }
